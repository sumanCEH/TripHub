server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/triphub_booking
    username: triphub
    password: triphub
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
