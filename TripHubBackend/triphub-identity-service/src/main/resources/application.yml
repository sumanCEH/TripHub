server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/triphub_identity
    username: triphub
    password: triphub
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  application:
    name: triphub-identity-service

jwt:
  secret: mySuperSecretKeyForTripHubPlatform1234567890
  expiration: 3600000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
